version: "1.0"
last_updated: "2026-07-22"
description: >
  Master competency configuration for the DE-INTERVIEWER platform.
  This file defines all technical competencies, evaluation weights,
  interview coverage requirements, follow-up behavior, and expected
  learning outcomes.

competencies:

  - id: C1
    active: true
    display_order: 1
    category: Technical

    name: SQL & Query Optimization

    evaluation_weight: 15

    minimum_questions: 2

    target_proficiency: 70

    followup_enabled: true
    max_followups: 2

    difficulty_levels:
      - Easy
      - Medium
      - Hard

    assessment_methods:
      - Direct Question
      - Follow-up
      - Scenario

    keywords:
      - SQL
      - JOIN
      - GROUP BY
      - HAVING
      - Window Function
      - CTE
      - Index
      - Execution Plan
      - Query Optimization

    skills:
      - SQL
      - Joins
      - Aggregations
      - Window Functions
      - Common Table Expressions
      - Indexing
      - Query Optimization
      - Execution Plans

    expected_outcomes:
      - Write efficient SQL queries
      - Optimize slow queries
      - Understand execution plans
      - Use analytical SQL functions

    description: >
      Ability to write efficient SQL queries,
      optimize execution plans,
      understand joins,
      indexing,
      window functions,
      aggregation,
      query tuning,
      and analytical SQL.


